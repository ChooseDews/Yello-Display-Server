services:
  yello-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: yello-studio:local
    restart: unless-stopped
    environment:
      YELLO_WEB_HOST: 0.0.0.0
      YELLO_DEVICE_HOST: 0.0.0.0
      # Studio/secrets live on the yello-data volume.
      YELLO_STUDIO_PATH: /data/studio.json
      YELLO_SECRETS_PATH: /data/secrets.json
    ports:
      - "8080:8080"
      - "8765:8765"
    volumes:
      - yello-data:/data

volumes:
  yello-data:

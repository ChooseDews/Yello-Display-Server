name: Windows build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
      - name: Build release binary
        run: cargo build --release --manifest-path server-rs/Cargo.toml
      - name: Package portable bundle
        run: |
          New-Item -ItemType Directory -Force -Path yello-server-windows | Out-Null
          Copy-Item server-rs/target/release/yello-server.exe yello-server-windows/
          Copy-Item -Recurse server-rs/static yello-server-windows/static
          Compress-Archive -Path yello-server-windows -DestinationPath yello-server-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: yello-server-windows-x64
          path: yello-server-windows-x64.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yello-server-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: yello-server-windows-x64.zip

name: Docker image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  container:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The About page's web flasher serves these from /static/firmware/.
      # The manifest offsets come from the firmware build's flasher_args.json,
      # so they stay correct if the partition layout ever moves.
      - name: Bundle the latest firmware for the web flasher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p server-rs/static/firmware
          if gh release download firmware-latest --repo "$GITHUB_REPOSITORY" \
              --pattern "*.bin" --pattern "flasher_args.json" \
              --dir server-rs/static/firmware 2>/dev/null; then
            python3 - <<'PYEOF'
          import json, os
          directory = "server-rs/static/firmware"
          with open(os.path.join(directory, "flasher_args.json")) as handle:
              flash_args = json.load(handle)
          parts = [
              {"path": os.path.basename(path), "offset": int(offset, 16)}
              for offset, path in sorted(flash_args["flash_files"].items(), key=lambda item: int(item[0], 16))
          ]
          manifest = {"name": "Yello Device", "version": "latest",
                      "builds": [{"chipFamily": "ESP32", "parts": parts}]}
          with open(os.path.join(directory, "manifest.json"), "w") as handle:
              json.dump(manifest, handle, indent=2)
          print("Bundled firmware parts:", [part["path"] for part in parts])
          PYEOF
          else
            echo "No firmware-latest release yet; the About page will report the firmware as not bundled."
          fi
      - name: Build and optionally publish platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          # One cache scope per architecture: with a shared default scope the
          # two parallel matrix builds export over each other and one arch
          # reliably loses its cargo target cache, paying a ~2.3 min rebuild
          # of the app crate even for static-only changes.
          cache-from: type=gha,scope=yello-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=yello-${{ matrix.arch }}
      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  container-merge:
    needs: [tests, container]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Create and publish multi-arch manifest
        working-directory: /tmp/digests
        run: |
          image="${IMAGE,,}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$image@sha256:%s " *)

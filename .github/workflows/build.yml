name: Build and package

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32 firmware
        working-directory: firmware
        run: |
          . "${IDF_PATH:-/opt/esp/idf}/export.sh"
          idf.py build
      - name: Collect flash artifacts
        run: |
          mkdir -p firmware-artifacts
          cp firmware/build/yello_device.bin firmware-artifacts/
          cp firmware/build/bootloader/bootloader.bin firmware-artifacts/
          cp firmware/build/partition_table/partition-table.bin firmware-artifacts/
          cp firmware/build/flasher_args.json firmware-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: yello-device-firmware
          path: firmware-artifacts

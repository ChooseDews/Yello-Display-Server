name: Build and package

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
      - name: Run Rust server tests
        run: cargo test --release --manifest-path server-rs/Cargo.toml
      - name: Check browser JavaScript syntax
        run: node --check server-rs/static/app.js

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32 firmware
        working-directory: firmware
        run: idf.py build
      - name: Collect flash artifacts
        run: |
          mkdir -p firmware-artifacts
          cp firmware/build/yello_device.bin firmware-artifacts/
          cp firmware/build/bootloader/bootloader.bin firmware-artifacts/
          cp firmware/build/partition_table/partition-table.bin firmware-artifacts/
          cp firmware/build/flasher_args.json firmware-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: yello-device-firmware
          path: firmware-artifacts

  container:
    needs: server-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and optionally publish container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-exe:
    needs: server-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --manifest-path server-rs/Cargo.toml
      - name: Package portable bundle
        run: |
          New-Item -ItemType Directory -Force -Path yello-server-windows | Out-Null
          Copy-Item server-rs/target/release/yello-server.exe yello-server-windows/
          Copy-Item -Recurse server-rs/static yello-server-windows/static
          Compress-Archive -Path yello-server-windows -DestinationPath yello-server-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: yello-server-windows-x64
          path: yello-server-windows-x64.zip

  linux-appimage:
    needs: server-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --manifest-path server-rs/Cargo.toml
      - name: Assemble AppDir
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/yello/server AppDir/usr/share/applications
          cp server-rs/target/release/yello-server AppDir/usr/bin/
          cp -r server-rs/static AppDir/usr/share/yello/static
          cat > AppDir/usr/share/applications/yello-server.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Yello Server
          Comment=Remote display server for ESP32 yellow displays
          Exec=yello-server
          Icon=yello
          Terminal=true
          Categories=Development;Utility;
          EOF
          cp AppDir/usr/share/applications/yello-server.desktop AppDir/yello-server.desktop
          convert -size 256x256 xc:"#F5A623" -fill black -gravity center \
            -pointsize 170 -annotate 0 "Y" AppDir/yello.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export YELLO_STATIC_DIR="$HERE/usr/share/yello/static"
          export YELLO_STUDIO_PATH="${YELLO_STUDIO_PATH:-$HOME/.config/yello/studio.json}"
          export YELLO_SECRETS_PATH="${YELLO_SECRETS_PATH:-$HOME/.config/yello/secrets.json}"
          mkdir -p "$HOME/.config/yello"
          exec "$HERE/usr/bin/yello-server" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/bin/yello-server
      - name: Build AppImage
        run: |
          set -euo pipefail
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Yello_Server-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: yello-server-linux-x86_64
          path: Yello_Server-x86_64.AppImage

  release:
    needs: [windows-exe, linux-appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            yello-server-windows-x64.zip
            Yello_Server-x86_64.AppImage

name: macOS build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    env:
      # Cross-compile settings for x86_64 (built on an arm64 runner via clang
      # -arch); ignored when target == host.
      CC_x86_64_apple_darwin: clang
      CXX_x86_64_apple_darwin: clang++
      CFLAGS_x86_64_apple_darwin: -arch x86_64
      CXXFLAGS_x86_64_apple_darwin: -arch x86_64
      CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: clang
      CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS: -C link-arg=-arch -C link-arg=x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --manifest-path server-rs/Cargo.toml
      - name: Package bundle
        run: |
          mkdir yello-server-macos
          cp server-rs/target/${{ matrix.target }}/release/yello-server yello-server-macos/
          cp -r server-rs/static yello-server-macos/static
          tar -czf yello-server-macos-${{ matrix.target }}.tar.gz yello-server-macos
      - uses: actions/upload-artifact@v4
        with:
          name: yello-server-${{ matrix.target }}
          path: yello-server-macos-${{ matrix.target }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yello-server-*-apple-darwin
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            yello-server-aarch64-apple-darwin.tar.gz
            yello-server-x86_64-apple-darwin.tar.gz

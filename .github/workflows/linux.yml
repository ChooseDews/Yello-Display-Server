name: Linux AppImage

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
      - name: Build release binary
        run: cargo build --release --manifest-path server-rs/Cargo.toml
      - name: Assemble AppDir
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/yello/server AppDir/usr/share/applications
          cp server-rs/target/release/yello-server AppDir/usr/bin/
          cp -r server-rs/static AppDir/usr/share/yello/static
          cat > AppDir/usr/share/applications/yello-server.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Yello Server
          Comment=Remote display server for ESP32 yellow displays
          Exec=yello-server
          Icon=yello
          Terminal=true
          Categories=Development;Utility;
          EOF
          cp AppDir/usr/share/applications/yello-server.desktop AppDir/yello-server.desktop
          python3 - <<'EOF'
          import zlib

          W = H = 256
          BG = (245, 166, 35)  # #F5A623
          FG = (0, 0, 0)

          glyph = [
              "X...X",
              "X...X",
              ".X.X.",
              "..X..",
              "..X..",
              "..X..",
              "..X..",
          ]

          cell = 32
          gw, gh = 5 * cell, 7 * cell
          ox, oy = (W - gw) // 2, (H - gh) // 2
          pix = [[BG] * W for _ in range(H)]
          for gy, row in enumerate(glyph):
              for gx, c in enumerate(row):
                  if c == "X":
                      for dy in range(cell):
                          y = oy + gy * cell + dy
                          for dx in range(cell):
                              x = ox + gx * cell + dx
                              pix[y][x] = FG

          raw = bytearray()
          for row in pix:
              raw.append(0)
              for px in row:
                  raw.extend(px)

          def chunk(tag, data):
              c = tag + data
              return len(data).to_bytes(4, "big") + c + zlib.crc32(c).to_bytes(4, "big")

          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", bytes((0, 0, 1, 0, 0, 0, 1, 0, 8, 2, 0, 0, 0)))
                 + chunk(b"IDAT", zlib.compress(bytes(raw)))
                 + chunk(b"IEND", b""))
          open("AppDir/yello.png", "wb").write(png)
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export YELLO_STATIC_DIR="$HERE/usr/share/yello/static"
          export YELLO_STUDIO_PATH="${YELLO_STUDIO_PATH:-$HOME/.config/yello/studio.json}"
          export YELLO_SECRETS_PATH="${YELLO_SECRETS_PATH:-$HOME/.config/yello/secrets.json}"
          mkdir -p "$HOME/.config/yello"
          exec "$HERE/usr/bin/yello-server" "$@"
          EOF
          chmod +x AppDir/AppRun AppDir/usr/bin/yello-server
      - name: Build AppImage
        run: |
          set -euo pipefail
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Yello_Server-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: yello-server-linux-x86_64
          path: Yello_Server-x86_64.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yello-server-linux-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          files: Yello_Server-x86_64.AppImage

[package]
name = "yello-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls-vendored"] }
tungstenite = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
chrono = "0.4"
thiserror = "1"
regex = "1"
sha1 = "0.10"
futures-util = "0.3"
bytes = "1"
anyhow = "1"
lazy_static = "1"
num-traits = "0.2"
reqwest = "0.11"
url = "2.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
hyper = { version = "0.14.32", features = ["full"] }
ab_glyph = "0.2.29"
